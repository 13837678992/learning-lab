# 主应用（qiankun 基座）Nginx 配置。
# 部署产物：apps/main/dist（VITE_BASE 默认 '/'）。
# 职责：托管基座 SPA + history 路由回退 + /api 反代网关。子应用由 qiankun 从各自源跨域拉取（见 subapp.conf）。

server {
  listen       80;
  server_name  fmac.example.com;              # ← 改为基座域名
  root         /usr/share/nginx/html/fmac-main;
  index        index.html;

  # 安全响应头（按需增减）
  add_header X-Content-Type-Options nosniff;
  add_header X-Frame-Options SAMEORIGIN;

  # 带 hash 的静态资源长缓存
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # 业务请求统一经 @fmac/request → /api，此处反代到网关
  location /api/ {
    proxy_pass         http://gateway.internal/;   # ← 改为实际网关地址
    proxy_set_header   Host $host;
    proxy_set_header   X-Real-IP $remote_addr;
    proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
  }

  # SPA history 回退：基座自身路由与子应用激活路径（/micro/*、/finance）都交给前端接管
  location / {
    try_files $uri $uri/ /index.html;
  }
}
