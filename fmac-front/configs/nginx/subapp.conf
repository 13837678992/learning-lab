# 子应用 Nginx 配置模板（每个子应用独立部署、独立域名或路径）。
# 以 user 为例；order/report/finance-demo 复制本模板改 server_name / root / base 即可。
#
# 关键：qiankun 从基座「跨域」拉取子应用 HTML/JS/CSS，必须放行 CORS，否则子应用无法加载。
# 若子应用部署在子路径（如 https://cdn.example.com/user/），构建时须 VITE_BASE=/user/。

server {
  listen       80;
  server_name  user.fmac.example.com;         # ← 改为子应用域名
  root         /usr/share/nginx/html/fmac-user;
  index        index.html;

  # —— qiankun 跨域放行 ——
  # 生产建议把 $http_origin 收敛为基座域名白名单，而非无条件反射。
  location / {
    add_header Access-Control-Allow-Origin  $http_origin always;
    add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Content-Type" always;
    if ($request_method = OPTIONS) { return 204; }

    try_files $uri $uri/ /index.html;         # 子应用 standalone 也支持 history 路由
  }

  location /assets/ {
    add_header Access-Control-Allow-Origin $http_origin always;
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
}
