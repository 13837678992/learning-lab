# FMAC 微前端 · 多域名/独立部署（子应用独立域名或 CDN）
#
# 适用：子应用与主应用分开部署到不同域名/端口/CDN，实现完全独立发布。
# 关键：子应用响应必须带 CORS 头（Access-Control-Allow-Origin），供基座 qiankun 跨源拉取。
# 主应用侧将 SUBAPP_DEMO_ENTRY 配置为子应用域名（见 main-layout/.env.prod）：
#   SUBAPP_DEMO_ENTRY=https://app-demo.fmac.example.com/

# ---------- 主应用（基座） ----------
server {
  listen       80;
  server_name  fmac.example.com;

  root  /usr/share/nginx/html/main-layout;
  index index.html;

  location / {
    try_files $uri $uri/ /index.html;
  }

  location ~* \.(?:js|css|png|jpe?g|gif|svg|woff2?|ttf|eot)$ {
    expires 7d;
    add_header Cache-Control "public, max-age=604800, immutable";
  }

  location /api/ {
    proxy_pass         http://127.0.0.1:8080;
    proxy_set_header   Host $host;
    proxy_set_header   X-Real-IP $remote_addr;
    proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
  }
}

# ---------- 子应用 app-demo（独立域名） ----------
server {
  listen       80;
  server_name  app-demo.fmac.example.com;

  root  /usr/share/nginx/html/app-demo;
  index index.html;

  # 允许基座跨源拉取子应用入口与资源（qiankun 必需）。
  add_header Access-Control-Allow-Origin  "https://fmac.example.com" always;
  add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
  add_header Access-Control-Allow-Headers "Content-Type, Authorization" always;

  location / {
    try_files $uri $uri/ /index.html;
  }

  location ~* \.(?:js|css|png|jpe?g|gif|svg|woff2?|ttf|eot)$ {
    expires 7d;
    add_header Cache-Control "public, max-age=604800, immutable";
    add_header Access-Control-Allow-Origin "https://fmac.example.com" always;
  }
}

# 说明：子应用独立域名时，PUBLIC_PATH 须为子应用域名根（构建期）或由 public-path.js
# 于 qiankun 运行期用 __INJECTED_PUBLIC_PATH_BY_QIANKUN__ 覆盖，确保资源从子应用源加载。
