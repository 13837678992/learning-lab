# FMAC 微前端 · 单域名部署（推荐）
# 主应用 main-layout 部署于 /；子应用 app-demo 部署于 /app-demo/。
#
# 目录布局（root 为公共父目录，用 root 而非 alias，规避 history 回退路径陷阱）：
#   /usr/share/nginx/html/
#   ├── index.html            ← main-layout/dist/*
#   ├── assets/               ← main-layout 资源（PUBLIC_PATH=/）
#   └── app-demo/             ← app-demo/dist/*（PUBLIC_PATH=/app-demo/）
#       ├── index.html
#       └── assets/
#
# 构建：
#   (cd main-layout && npm run build)   # PUBLIC_PATH=/        （.env.prod）
#   (cd app-demo   && npm run build)    # PUBLIC_PATH=/app-demo/（.env.prod）

server {
  listen       80;
  server_name  fmac.example.com;

  root  /usr/share/nginx/html;
  index index.html;

  # 子应用（更具体的前缀优先匹配）：history 回退到子应用自身 index。
  location /app-demo {
    try_files $uri $uri/ /app-demo/index.html;
  }

  # 主应用（基座）：history 回退到基座 index。
  location / {
    try_files $uri $uri/ /index.html;
  }

  # 带 hash 的静态资源长缓存；HTML 不缓存（保证发布即时生效）。
  location ~* \.(?:js|css|png|jpe?g|gif|svg|woff2?|ttf|eot)$ {
    expires 7d;
    add_header Cache-Control "public, max-age=604800, immutable";
  }
  location ~* \.html$ {
    add_header Cache-Control "no-cache";
  }

  # 后端 API 反向代理（按需替换上游）。
  location /api/ {
    proxy_pass         http://127.0.0.1:8080;
    proxy_set_header   Host $host;
    proxy_set_header   X-Real-IP $remote_addr;
    proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
  }
}
