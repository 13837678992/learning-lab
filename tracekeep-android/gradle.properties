# Gradle 守护进程内存（AGP 构建默认 512m 不足）
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8

# 本机 JDK 17 不在标准探测路径（Homebrew keg-only），显式登记：
# - org.gradle.java.home 供 Gradle 守护进程使用（本机专用路径，见 docs/ENVIRONMENT.md）
# - org.gradle.java.installations.paths 供 toolchain 解析
org.gradle.java.home=/opt/homebrew/opt/openjdk@17
org.gradle.java.installations.paths=/opt/homebrew/opt/openjdk@17

# Android 基线
android.useAndroidX=true
android.nonTransitiveRClass=true

# Kotlin
kotlin.code.style=official
